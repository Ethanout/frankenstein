name: Build

on:
  push:
  pull_request:

jobs:
  root-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install beet bolt bolt-expressions
      - run: beet build
